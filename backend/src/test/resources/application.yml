spring:
  datasource:
    url: jdbc:h2:mem:lockedin-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

jwt:
  secret: test-only-secret-at-least-thirty-two-characters
  expiration-hours: 24

auth:
  dev-header-enabled: true

app:
  cors:
    allowed-origin-patterns: http://localhost:*

scoring:
  max-weekly-points: 100
  max-log-minutes: 240
  week-starts-on: MONDAY

monthly-results:
  cron: "0 5 0 1 * *"
  zone: America/Los_Angeles

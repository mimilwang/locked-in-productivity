spring:
  application:
    name: locked-in
  datasource:
    url: jdbc:h2:mem:lockedin;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

# Auth: replace the secret with an env variable before deploying (at least 32 characters).
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
  expiration-hours: 24

auth:
  # TEMPORARY: lets you send "X-User-Id: 1" instead of a JWT while testing.
  # Set to false before deploying.
  dev-header-enabled: true

app:
  cors:
    allowed-origins: http://localhost:5173

images:
  upload-dir: uploads

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# All scoring numbers live here. Change them in one place.
scoring:
  minutes-per-point: 10      # 1 point for every 10 minutes logged
  daily-point-cap: 30        # max minute-points per person per day
  weekly-goal-bonus: 20      # bonus the day you hit the weekly goal
  streak-bonus-per-day: 2    # streak bonus = streak length x this (from day 2 of a streak)
  streak-bonus-cap: 10       # max streak bonus per day
  group-goal-bonus: 5        # everyone gets this when the WHOLE league hits the weekly goal
  max-log-minutes: 240       # longest single log allowed
  week-starts-on: MONDAY

monthly-results:
  cron: "0 5 0 1 * *"        # 12:05am on the 1st of every month
  zone: America/Los_Angeles

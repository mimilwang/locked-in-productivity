spring:
  application:
    name: locked-in
  datasource:
    # Persistent local default. Production should set SPRING_DATASOURCE_URL to PostgreSQL.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/lockedin;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}

# Auth: replace the secret with an env variable before deploying (at least 32 characters).
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
  expiration-hours: 24

auth:
  # TEMPORARY: lets you send "X-User-Id: 1" instead of a JWT while testing.
  # Set to false before deploying.
  dev-header-enabled: ${DEV_HEADER_ENABLED:true}

app:
  cors:
    # Comma-separated origin patterns. Defaults cover Vite on this computer and phones
    # reaching it over a private LAN. Set this explicitly to the frontend URL in production.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*}

images:
  upload-dir: ${UPLOAD_DIR:uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# All scoring numbers live here. Change them in one place.
# Your weekly score = % of the league's weekly goal you've done (rounded down), max max-weekly-points.
scoring:
  max-weekly-points: 100     # 100% of the weekly goal = 100 points (50% = 50)
  max-log-minutes: 240       # longest single log / timer that counts
  week-starts-on: MONDAY     # weekly scores reset on this day

monthly-results:
  cron: "0 5 0 1 * *"        # 12:05am on the 1st of every month
  zone: America/Los_Angeles
